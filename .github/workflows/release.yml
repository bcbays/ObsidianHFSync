name: Release

# Triggers whenever you push a tag like "v1.0.1". Builds the plugin and publishes
# main.js / manifest.json / styles.css as downloadable assets on a GitHub Release,
# which is what HF Sync's in-app "Check for updates" button downloads from.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Verify manifest.json version matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match manifest.json version ($MANIFEST_VERSION)."
            echo "Update manifest.json's \"version\" field to match before tagging."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/hf-sync/main.js
            dist/hf-sync/manifest.json
            dist/hf-sync/styles.css
          fail_on_unmatched_files: false
          generate_release_notes: true
